name: Top languages

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the language card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          EXCLUDE: "HTML,CSS,SCSS,Makefile"
          TOP_N: "6"
          OUTPUT: profile/top-languages.svg
        run: python scripts/top_languages.py

      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-languages.svg
          git diff --cached --quiet || (git commit -m "Update top languages" && git push)
